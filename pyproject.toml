[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-fetcher"
version = "0.1.0"
description = "Download videos via SnapAny from a URL or share text; print the local save directory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
]

[project.scripts]
video-fetcher = "video_fetcher.cli:main"

[tool.setuptools.packages.find]
include = ["video_fetcher*"]
